<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Luma, your gaming life at home.</title>
<desc id="desc">Warm white Luma lettering above a green aurora. An illuminated star with four points connects three constellations representing home, library, and journey.</desc>
